name: Release

# Release engineering (cards #33 + #99): the six public @ticora packages are
# changeset-versioned in-repo AND published to npm. Accumulated changesets on
# main become one version commit + a single `vX.Y.Z` git tag (the semver
# source of truth the compat suite pins to), then `changeset publish` pushes
# the public packages to npm with provenance; every main build also packs
# canary tarballs vendors can install ahead of a release.
# Policy: devdocs/release-policy.md.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # npm provenance attestation is signed via GitHub OIDC (#99).
  id-token: write

jobs:
  version-and-tag:
    name: version + tag (when changesets exist)
    runs-on: ubuntu-latest
    # The version commit this job pushes must not re-trigger a release loop.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Semver gate (api surface + previous-minor compat)
        if: steps.pending.outputs.count != '0'
        run: |
          npx turbo build --filter='@ticora/core' --filter='@ticora/react' --filter='@ticora/ui' --filter='@ticora/client' --filter='@ticora/cli' --filter='@ticora/devtools'
          npm run api-surface:check
          npm run compat
      - name: Version packages and tag
        if: steps.pending.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx changeset version
          version=$(node -p "require('./packages/core/package.json').version")
          git add -A
          git commit -m "chore(release): v${version}"
          # Annotated + explicitly pushed: `--follow-tags` silently drops
          # lightweight tags (v0.2.0's tag died in the runner exactly this way).
          git tag -a "v${version}" -m "v${version}"
          git push origin HEAD "refs/tags/v${version}"
      - name: Guard — private packages must never publish
        if: steps.pending.outputs.count != '0'
        run: npm run check:private
      - name: Publish public packages to npm (provenance via OIDC)
        if: steps.pending.outputs.count != '0'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          # changeset publish skips any package with "private": true, so only
          # the six public @ticora packages go out. Requires NPM_TOKEN with
          # publish rights on the @ticora scope.
          npx changeset publish

  canary:
    name: canary tarballs
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Detect pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Stamp snapshot versions (0.0.0-canary-*)
        # With no pending changesets the tarballs simply carry the released
        # version — the artifact still gives vendors a per-commit install.
        if: steps.pending.outputs.count != '0'
        run: npx changeset version --snapshot canary
      - run: npm run build
      - run: npm run pack:canary
      - uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.sha }}
          path: canary-dist/*.tgz
          retention-days: 14
